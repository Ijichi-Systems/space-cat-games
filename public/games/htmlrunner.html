<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2104022260564752" crossorigin="anonymous"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Rapid Prototyping Tool</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        textarea {
            width: 100%;
            height: 200px;
        }
        iframe {
            width: 90vw;
            height: calc(90vw * 6 / 16);
            border: 1px solid #ccc;
            margin-top: 10px;
        }
        button {
            margin-top: 10px;
            padding: 8px 12px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>

<script>
  !function(b,e,t,r){
    b[t]=b[t]||function(...args){(b[t].q=b[t].q||[]).push(args)};
    b[t].l=+new Date;
    var s=e.createElement('script'); s.async=1; s.crossOrigin='anonymous';
    s.src='https://betterstack.net/b.js?t='+r;
    (e.head||e.getElementsByTagName('head')[0]).appendChild(s);
  }(window,document,'betterstack','Xx9RqEJ7jW6ofziTJ92TkoQk');
  betterstack('init', { environment: 'production' });
</script>
</head>
<body>
    <h2>HTML Rapid Prototyping Tool</h2>
    <textarea id="code" placeholder="Write your HTML, CSS, and JavaScript here..." spellcheck="false" autocomplete="off"></textarea>
    <br>
    <button onclick="runCode()">Run</button>
    <button onclick="downloadCode()">Download</button>
    <button onclick=”openFullscreen()”>View Full Preview</button>
    <br>
    <iframe id="preview"></iframe>


    <script>
        function runCode() {
            const code = document.getElementById('code').value;
            const iframe = document.getElementById('preview');
            iframe.contentDocument.body.innerHTML = code;
            iframe.contentWindow.eval(code);
        }


        function downloadCode() {
            const code = document.getElementById('code').value;
            const blob = new Blob([code], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'tryit_editor.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
      function openFullscreen() {
          const code = document.getElementById('code').value;
          const newWindow = window.open();
          newWindow.document.write(code);
          newWindow.document.close();
      }


    </script>
</body>
</html>
