<!DOCTYPE html>
<html>
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2104022260564752" crossorigin="anonymous"></script>

  <title>Pong Game</title>
  <style>
    #gameCanvas {
      background-color: black;
      border: 2px solid white;
      display: block;
      margin: 50px auto;
    }

    .paddle {
      background-color: white;
      position: absolute;
      width: 10px;
      height: 60px;
    }

    .ball {
      background-color: white;
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
  </style>

<script>
  !function(b,e,t,r){
    b[t]=b[t]||function(...args){(b[t].q=b[t].q||[]).push(args)};
    b[t].l=+new Date;
    var s=e.createElement('script'); s.async=1; s.crossOrigin='anonymous';
    s.src='https://betterstack.net/b.js?t='+r;
    (e.head||e.getElementsByTagName('head')[0]).appendChild(s);
  }(window,document,'betterstack','Xx9RqEJ7jW6ofziTJ92TkoQk');
  betterstack('init', { environment: 'production' });
</script>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 600;
    canvas.height = 400;

    // Paddle properties
    const paddleWidth = 10;
    const paddleHeight = 60;
    let playerPaddleY = canvas.height / 2 - paddleHeight / 2;
    let opponentPaddleY = canvas.height / 2 - paddleHeight / 2;

    // Ball properties
    let ballX = canvas.width / 2;
    let ballY = canvas.height / 2;
    let ballRadius = 5;
    let ballSpeedX = 5;
    let ballSpeedY = 5;

    // Game state
    let playerScore = 0;
    let opponentScore = 0;

    // Function to draw the paddles
    function drawPaddles() {
      ctx.fillRect(10, playerPaddleY, paddleWidth, paddleHeight); // Player paddle
      ctx.fillRect(canvas.width - 20, opponentPaddleY, paddleWidth, paddleHeight); // Opponent paddle
    }

    // Function to draw the ball
    function drawBall() {
      ctx.beginPath();
      ctx.arc(ballX, ballY, ballRadius, 0, Math.PI * 2);
      ctx.fillStyle = 'white';
      ctx.fill();
      ctx.closePath();
    }

    // Function to update the ball's position
    function updateBall() {
      ballX += ballSpeedX;
      ballY += ballSpeedY;
    }

    // Function to handle collisions with the walls
    function checkWallCollisions() {
      if (ballY + ballRadius > canvas.height || ballY - ballRadius < 0) {
        ballSpeedY = -ballSpeedY;
      }
    }

    // Function to handle collisions with the paddles
    function checkPaddleCollisions() {
      // Player paddle collision
      if (ballX - ballRadius < paddleWidth && ballY > playerPaddleY && ballY < playerPaddleY + paddleHeight) {
        ballSpeedX = -ballSpeedX;
      }

      // Opponent paddle collision
      if (ballX + ballRadius > canvas.width - paddleWidth && ballY > opponentPaddleY && ballY < opponentPaddleY + paddleHeight) {
        ballSpeedX = -ballSpeedX;
      }
    }

    // Function to handle scoring
    function checkScore() {
      if (ballX - ballRadius < 0) {
        opponentScore++;
        resetBall();
      } else if (ballX + ballRadius > canvas.width) {
        playerScore++;
        resetBall();
      }
    }

    // Function to reset the ball to the center
    function resetBall() {
      ballX = canvas.width / 2;
      ballY = canvas.height / 2;
      ballSpeedX = 5;
      ballSpeedY = 5;
    }

    // Function to update the game state
    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      updateBall();
      checkWallCollisions();
      checkPaddleCollisions();
      checkScore();
      drawPaddles();
      drawBall();
    }

    // Game loop
    setInterval(update, 10); 
  </script>
</body>
</html>
